spring.application.name=infodive-api
# application.properties — Infodive API
# Copie este arquivo para src/main/resources/application.properties
# e preencha as variáveis de ambiente

# ─────────────────────────────────────────
# Servidor
# ─────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api/v1

# ─────────────────────────────────────────
# Banco de Dados — Supabase PostgreSQL
# ─────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─────────────────────────────────────────
# Supabase Storage
# ─────────────────────────────────────────
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.bucket=${SUPABASE_STORAGE_BUCKET:images}

# ─────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Inicialização SQL (data.sql) — desativada permanentemente.
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# ─────────────────────────────────────────
# Jackson (JSON)
# ─────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# ─────────────────────────────────────────
# Segurança
# ─────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.mock-entra-id=${MOCK_ENTRA_ID:false}
azure.tenant-id=${AZURE_TENANT_ID}
azure.client-id=${AZURE_CLIENT_ID}
auth.blogger-emails=${BLOGGER_EMAILS:}
auth.blogger-domains=${BLOGGER_DOMAINS:}
auth.partner-access-key=${PARTNER_ACCESS_KEY:infodive_partner_2026}

# CORS — origens permitidas
cors.allowed-origins=${ALLOWED_ORIGINS}

# ─────────────────────────────────────────
# Logs
# ─────────────────────────────────────────
logging.level.br.com.infodive=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN

# ─────────────────────────────────────────
# Envio de E-mail (SMTP / Gmail / Microsoft 365)
# ─────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SSL_TRUST:*}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

lead.notification.email=${LEAD_NOTIFICATION_EMAIL:contato@infodive.com.br}

