# Test Application Configuration
spring.application.name=infodive-api-test
server.servlet.context-path=/api/v1

# H2 In-Memory Database Configuration for Tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate for H2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Security & Mock Entra ID for Tests
jwt.secret=9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
jwt.expiration=86400000
jwt.mock-entra-id=true
azure.tenant-id=mock-tenant-id
azure.client-id=mock-client-id
auth.blogger-emails=
auth.blogger-domains=
auth.partner-access-key=infodive_partner_test

# Disable defer initialization
spring.sql.init.mode=never

# Mail Config for Tests
lead.notification.email=contato@infodive.com.br

